# fs-linux-test-harness consumer config (see ../fs-linux-test-harness/README.md).
#
# EVERYTHING THAT IS LINUX HAPPENS IN HERE. The erofs-utils oracles
# (mkfs.erofs, fsck.erofs, dump.erofs), because the packaged build on a
# workstation is whatever that machine has — Debian 12 ships 1.5, Ubuntu
# 24.04 ships 1.7.1, and neither knows the options this suite uses; the
# kernel oracles, which loop-mount our images with the real EROFS driver;
# the fixtures the kernel or a tool has to produce; and, on a host that is
# not Linux, the suite itself (`chore test:vm`).

[project]
name = "rust-fs-erofs"

[setup]
# Runs as root INSIDE the VM; builds erofs-utils 1.9.1 from source (with
# libzstd, which the packaged builds usually lack), installs attr and the
# loop driver, and the toolchain the in-guest suite builds with.
script = "scripts/vm-setup.sh"

[test]
# Runs INSIDE the guest, from /repo (this repository, mounted there).
guest_command = "scripts/guest-suite.sh"

[share]
dir = ".vm-share"
