name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHORE_VERSION: "0.11.0"

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        # rust-fs-core (the path dependency) and fs-linux-test-harness, at
        # the refs pinned in chores.yml.
        run: chore siblings

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          if [ "$tag" != "$crate_ver" ]; then
            echo "tag $tag does not match Cargo.toml version $crate_ver" >&2
            exit 1
          fi

      # THE ORACLE TOOLS ARE NOT INSTALLED HERE. They live in the
      # fs-linux-test-harness guest, built from source by
      # scripts/vm-setup.sh, which is the same place `chore test` reaches
      # them from on a developer's machine. What stood here was a 60-line
      # source build of erofs-utils 1.9.1 on the runner, duplicated from
      # ci.yml, and `cargo test -- --ignored` to opt the oracles back in.
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}

      - name: chore fixtures
        run: chore fixtures
      - name: chore lint
        run: chore lint
      - name: chore test
        run: chore test
      - name: Keep the tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-release
          path: tmp/logs/*.log
          if-no-files-found: error

  publish:
    name: publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings

      - uses: dtolnay/rust-toolchain@stable

      # A version already on crates.io cannot be published again, and a
      # re-tag — or a release published by hand — would otherwise fail
      # this job every time. Skip instead, so the workflow is idempotent
      # and a red run means something actually went wrong.
      - name: skip if this version is already on crates.io
        id: already
        shell: bash
        run: |
          set -euo pipefail
          name="$(grep -m1 '^name = ' Cargo.toml | sed 's/name = //; s/"//g')"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //; s/"//g')"
          if curl -sf "https://crates.io/api/v1/crates/$name/$version" \
               -H 'User-Agent: release-workflow' >/dev/null 2>&1; then
            echo "$name $version is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name $version is not on crates.io; publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1.0.4
        if: steps.already.outputs.published == 'false'
        id: auth

      - name: cargo publish
        if: steps.already.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # No `--locked`: publish must rewrite the `am-fs-core` path
        # dependency into its registry equivalent in the packaged
        # lockfile, which `--locked` forbids ("cannot update the lock
        # file"). The verify-build resolves am-fs-core from crates.io via
        # the `version` constraint, so the published artifact is pinned by
        # that constraint, not by the local path checkout.
        run: cargo publish
