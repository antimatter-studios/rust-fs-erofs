name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    # The job name stays keyed on `os`: branch protection requires the
    # context `test-ubuntu-latest` by name, and renaming it would leave
    # that required check permanently pending.
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One architecture failing must not cancel the other's evidence.
      fail-fast: false
      matrix:
        # Natively on both, not a cross-target `cargo check`: `c_char` is
        # signed on x86_64-linux and unsigned on aarch64-linux, so a cast
        # through it can be real on one and a clippy error on the other
        # (#89), and only a native run also lints and executes there.
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # The crate has a path dep on am-fs-core (../rust-fs-core).
      # Clone the sibling repo alongside so cargo can resolve it.
      # Anonymous HTTPS clone — rust-fs-core is public.
      - name: Clone sibling rust-fs-core
        run: git clone --depth 1 --branch v0.2.10 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # erofs-utils provides mkfs.erofs / fsck.erofs / dump.erofs — the
      # oracle binaries the #[ignore]-gated round-trip and oracle_compat
      # tests shell out to. ubuntu-latest's apt erofs-utils is 1.7.1
      # which predates variable block-size + the dump.erofs "Filesystem
      # blocksize:" line our writer tests assert against, so we
      # source-build 1.9.1 instead. `attr` provides setfattr/getfattr
      # for the xattr oracle paths.
      - name: Install erofs-utils 1.9.1 from source + attr
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            attr \
            autoconf automake libtool pkg-config \
            uuid-dev libselinux1-dev liblz4-dev liblzma-dev libzstd-dev zlib1g-dev
          curl -sSL https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git/snapshot/erofs-utils-1.9.1.tar.gz | tar -xz
          cd erofs-utils-1.9.1
          ./autogen.sh
          ./configure --enable-fuse=no
          make -j"$(nproc)"
          sudo make install
          mkfs.erofs --version | head -1
          fsck.erofs --version | head -1
          dump.erofs --version | head -1
          # The xattr oracles need setfattr. Verified here as well as in the
          # tests, which also fail in CI when a set fails for any other
          # reason (#91). Not piped through `head`: without pipefail the
          # pipeline's status would be head's, and a missing tool would pass.
          setfattr --version
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # A FLOOR UNDER THE SUITE, BECAUSE THE FAILURE MODE HERE IS AN
      # ABSENCE. `cargo test` exits 0 on "0 passed; 0 failed", so a
      # filter that selects nothing, a build that produced no test
      # binaries, or a suite list that came out empty all report the
      # same green as a full run. Nothing in this workflow could tell
      # those apart before #118; only a count can.
      #
      # Measured 2026-09-17 on run 35181354516 (main 0c16b34), this
      # step alone: 437 tests executed, identically on ubuntu-latest
      # and ubuntu-24.04-arm. Floor 400. It moves UP with the suite and
      # never down -- a floor that is lowered to make a red run green
      # is the same blindness with a number beside it.
      #
      # This is the FIRST of three floors, one per run selection. The
      # `--ignored` run below and the debug `--lib` run below that
      # select DISJOINT sets, and either can empty on its own without
      # this one noticing.
      - name: Test suite (release), with an executed-test floor
        run: |
          # The runner's default shell is `bash -eo pipefail`, so a
          # failing cargo would end the step right here and the count
          # would never run. A truncated run is precisely what is worth
          # naming, so the status is kept by hand and re-raised at the
          # end instead.
          set +e
          cargo test --locked --release 2>&1 | tee "$RUNNER_TEMP/test-release.log"
          rc=${PIPESTATUS[0]}
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test-release.log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 400)"
          if [ "$n" -lt 400 ]; then
              echo "::error::only $n tests executed, floor is 400 -- 437 ran on 2026-09-17 (run 35181354516), and a run that executes fewer than that stopped early rather than passed"
              exit 1
          fi
          exit "$rc"
      - name: Oracle suite (--ignored), with its own executed-test floor
        run: |
          # ITS OWN FLOOR, NOT A SHARE OF THE ONE ABOVE. `--ignored`
          # INVERTS the selection: it runs exactly the tests the run
          # above skipped, so the two counts are disjoint and either
          # can go to zero while the other is untouched. Folded into a
          # single number, 437 + 75 still clears any floor worth
          # setting even when this run selects nothing at all -- and
          # this run selecting nothing is the realistic accident: an
          # `#[ignore = "..."]` reason string edited, the oracle tests
          # moved to another file, or a `#[ignore]` dropped so the
          # tests migrate into the run above and vanish from here
          # without changing the total. See #118.
          #
          # Measured 2026-09-17 on run 35181354516 (main 0c16b34),
          # this step alone: 75 tests executed, identically on
          # ubuntu-latest and ubuntu-24.04-arm. Floor 70.
          #
          # Oracle tests are #[ignore]-gated so a fresh checkout without
          # erofs-utils still passes `cargo test`. CI installed the
          # oracle above, so we opt them in here.
          set +e
          cargo test --locked --release -- --ignored 2>&1 | tee "$RUNNER_TEMP/test-ignored.log"
          rc=${PIPESTATUS[0]}
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test-ignored.log" | awk '{s+=$4} END{print s+0}')
          echo "ignored-opt-in tests executed: $n (floor 70)"
          if [ "$n" -lt 70 ]; then
              echo "::error::only $n --ignored tests executed, floor is 70 -- 75 ran on 2026-09-17 (run 35181354516); the opt-in selected almost nothing, which is green and meaningless"
              exit 1
          fi
          exit "$rc"

      # AND ONCE WITHOUT `--release` -- THE PR GATE COULD NOT SEE AN
      # OVERFLOW OTHERWISE.
      #
      # overflow-checks defaults on in [profile.dev] and off in
      # [profile.release]. Cargo.toml's [profile.release] carries lto,
      # codegen-units, opt-level and panic only, and its [profile.dev]
      # carries opt-level and panic only -- neither overrides the
      # default, so the two runs above wrap a bad addition silently and
      # report success. This repository already has a debug run --
      # release.yml:71, `cargo test --locked --all-targets` -- but that
      # workflow triggers on a version TAG, not a pull request, so a
      # wrapping defect merges green here and only surfaces days later,
      # detached from the change and from the reviewer who could have
      # caught it, when someone else cuts the next release. See #68.
      #
      # `--lib` only: a second compile of the same sources, no oracle
      # binaries needed, and the arithmetic lives in the unit tests.
      # `EXPECT_OVERFLOW_CHECKS=1` tells
      # `overflow_checks::the_build_the_gate_asked_to_check_does_check`
      # in src/lib.rs that this is the run that must trap an overflow --
      # asking the build directly rather than inferring it from which
      # spellings of "disabled" happen to be absent from Cargo.toml. The
      # release steps must NOT set it: the checks are off there
      # deliberately, because that is what ships.
      #
      # Do not remove this as a duplicate of the runs above it, and do
      # not drop the variable from it: tests/ci_profile.rs asserts that
      # ci.yml -- this workflow specifically, not release.yml -- still
      # runs a `cargo test` without `--release` that sets it, and says
      # why release.yml having one is not enough.
      - name: Debug --lib run (overflow checks), with its own floor
        run: |
          # THE THIRD RUN SELECTION, AND THE THIRD FLOOR. `--lib`
          # selects only the unit tests inside src/, a different set
          # again from the two runs above, and it is the only run that
          # arms
          # `overflow_checks::the_build_the_gate_asked_to_check_does_check`.
          # If this selection ever empties -- the unit tests moved out
          # of src/, `--lib` stopped matching, the binary failed to
          # build any tests -- the handshake test is among the tests
          # that did not run, and the step reports the same green as a
          # full pass. tests/ci_profile.rs proves the STEP is still
          # here and still asks the build to check; only a count proves
          # anything actually ran.
          #
          # Measured 2026-09-17 on run 35181354516 (main 0c16b34),
          # this step alone: 235 tests executed, identically on
          # ubuntu-latest and ubuntu-24.04-arm. Floor 215.
          set +e
          EXPECT_OVERFLOW_CHECKS=1 cargo test --locked --lib 2>&1 | tee "$RUNNER_TEMP/test-lib.log"
          rc=${PIPESTATUS[0]}
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test-lib.log" | awk '{s+=$4} END{print s+0}')
          echo "debug --lib tests executed: $n (floor 215)"
          if [ "$n" -lt 215 ]; then
              echo "::error::only $n --lib tests executed, floor is 215 -- 235 ran on 2026-09-17 (run 35181354516), and the overflow handshake is one of the tests a short run can silently drop"
              exit 1
          fi
          exit "$rc"

  # Validate the mkfs_erofs CLI binary's output by running upstream's
  # fsck.erofs (from erofs-utils) against an image we generated. This is
  # the canonical "does the kernel-shipped reader think this is a valid
  # EROFS volume?" check — much stricter than our own crate's read-path
  # round-trip because it exercises every superblock / inode / layout
  # assertion in the upstream tooling, including CRC32C verification.
  #
  # Runs on every PR + push so a regression in the mkfs path is caught
  # before the binary ships to a tag.
  validate-mkfs-bin:
    name: validate mkfs_erofs (fsck.erofs strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The crate has a path dep on am-fs-core (../rust-fs-core).
      # Clone the sibling repo alongside so cargo can resolve it.
      - name: Clone sibling rust-fs-core
        run: git clone --depth 1 --branch v0.2.10 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # Same 1.9.1-from-source path as the test job: apt's 1.7.1 is too
      # old to print "Filesystem blocksize:" and rejects images with
      # variable block sizes that our writer can produce.
      - name: Install erofs-utils 1.9.1 from source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake libtool pkg-config \
            uuid-dev libselinux1-dev liblz4-dev liblzma-dev libzstd-dev zlib1g-dev
          curl -sSL https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git/snapshot/erofs-utils-1.9.1.tar.gz | tar -xz
          cd erofs-utils-1.9.1
          ./autogen.sh
          ./configure --enable-fuse=no
          make -j"$(nproc)"
          sudo make install
          fsck.erofs --version | head -1
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mkfs-${{ hashFiles('**/Cargo.lock') }}
      - name: Build mkfs_erofs
        run: cargo build --locked --release --bin mkfs_erofs
      - name: Build a small source tree, mkfs it, validate with fsck.erofs
        run: |
          src=/tmp/src
          out=/tmp/out.erofs
          mkdir -p "$src/sub/nested"
          echo "hello world" > "$src/file.txt"
          echo "another" > "$src/sub/another.txt"
          printf '0123456789%.0s' {1..200} > "$src/sub/nested/longer.txt"
          ./target/release/mkfs_erofs "$out" "$src"
          ls -la "$out"
          # fsck.erofs's clean exit is the canonical "this is a valid
          # EROFS image" signal. Verbose flag prints the structural
          # walk so failures point at the offending inode/block.
          fsck.erofs --extract=/tmp/extracted "$out"
          # Cross-check: extracted tree byte-matches the source.
          diff -r "$src" /tmp/extracted
      - name: Dump superblock + structure for inspection in CI logs
        run: dump.erofs /tmp/out.erofs
