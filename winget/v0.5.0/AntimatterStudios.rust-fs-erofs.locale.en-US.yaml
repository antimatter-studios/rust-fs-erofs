ShortDescription: Read, list and extract files from EROFS images without mounting them.
Description: |
  fs.erofs reads EROFS (Enhanced Read-Only File System) images, such as
  the system, vendor and product images of an Android ROM, without a
  driver: info, ls, stat, read, get and recursive export of a whole tree.
  It refuses every mutation, since EROFS is read-only. mkfs.erofs builds
  an EROFS image from a directory. Both are names for rust-fs-erofs.exe,
  a clean-room pure-Rust implementation.
